name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macOS covers bash 3.2, which install.sh must support.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [18, 22]
    steps:
      - uses: actions/checkout@v4
        with:
          # The version gate reads a merge base against origin/main: a depth-1
          # checkout has neither, and the gate would exit 2 on every run.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Tests
        run: npm test
      - name: Checks (frontmatter, links, skill calls, OpenCode commands, routing eval)
        run: npm run check
      - name: Version gate
        run: node scripts/version-gate.mjs
      - name: Install dry run
        run: node scripts/install.mjs --dry-run --no-hooks
      - name: Install dry run (bash bootstrap)
        if: runner.os != 'Windows'
        run: bash scripts/install.sh --dry-run --no-hooks
